name: Tests

on:
  push:
    branches: [main, feature/admin-content-management]
  pull_request:

permissions:
  contents: read

jobs:
  safe-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit --pretty false
      - run: bun run test:typecheck:e2e
      - run: bun run test:drizzle
      - run: bun run test:unit
      - run: bun run build
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:e2e
